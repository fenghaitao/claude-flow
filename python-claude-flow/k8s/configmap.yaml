# ConfigMap for Claude-Flow application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: claude-flow-config
  namespace: claude-flow
  labels:
    app.kubernetes.io/name: claude-flow
    app.kubernetes.io/component: config
data:
  config.yaml: |
    # Claude-Flow Production Configuration
    environment: production
    debug: false
    log_level: INFO
    
    # Database configuration
    database:
      url: "postgresql://claudeflow:${POSTGRES_PASSWORD}@postgres-service:5432/claudeflow"
      pool_size: 20
      max_overflow: 0
      pool_timeout: 30
      pool_recycle: 3600
    
    # Redis configuration
    redis:
      url: "redis://:${REDIS_PASSWORD}@redis-service:6379/0"
      max_connections: 50
      retry_on_timeout: true
    
    # Claude AI configuration
    claude:
      api_key: "${ANTHROPIC_API_KEY}"
      model: "claude-3-sonnet-20240229"
      max_tokens: 4096
      timeout: 30
      max_retries: 3
    
    # Agent configuration
    agents:
      max_workers: 10
      task_timeout: 300
      coordination_interval: 10
    
    # Monitoring configuration
    monitoring:
      prometheus:
        enabled: true
        port: 9090
        path: "/metrics"
      jaeger:
        enabled: true
        endpoint: "jaeger-collector:14268"
        service_name: "claude-flow"
      health_checks:
        enabled: true
        interval: 30
    
    # Tracing configuration
    tracing:
      service_name: "claude-flow"
      service_version: "1.0.0"
      environment: "production"
      sample_rate: 0.1
      jaeger:
        endpoint: "jaeger-collector:14268"
    
    # Logging configuration
    logging:
      level: "INFO"
      format: "json"
      include_trace_info: true
    
    # Security configuration
    security:
      cors_origins: ["https://claude-flow.example.com"]
      allowed_hosts: ["claude-flow.example.com"]
      csrf_protection: true

  nginx.conf: |
    upstream claude_flow_backend {
        least_conn;
        server claude-flow-app:8000 max_fails=3 fail_timeout=30s;
    }
    
    upstream ai_worker_backend {
        least_conn;
        server ai-worker:8001 max_fails=3 fail_timeout=30s;
    }
    
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        
        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
        
        # Main application
        location / {
            proxy_pass http://claude_flow_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
        
        # AI worker endpoints
        location /ai/ {
            proxy_pass http://ai_worker_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
        }
        
        # Health check endpoint
        location /health {
            access_log off;
            proxy_pass http://claude_flow_backend/health;
        }
        
        # Metrics endpoint (restricted)
        location /metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://claude_flow_backend/metrics;
        }
    }

  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'claude-flow-prod'
        environment: 'production'
    
    rule_files:
      - "alert_rules.yml"
    
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
              - alertmanager:9093
    
    scrape_configs:
      - job_name: 'claude-flow'
        static_configs:
          - targets: ['claude-flow-app:8000']
        metrics_path: '/metrics'
        scrape_interval: 30s
        scrape_timeout: 10s
        
      - job_name: 'ai-worker'
        static_configs:
          - targets: ['ai-worker:8001']
        metrics_path: '/metrics'
        scrape_interval: 30s
        
      - job_name: 'postgres'
        static_configs:
          - targets: ['postgres-exporter:9187']
        scrape_interval: 30s
        
      - job_name: 'redis'
        static_configs:
          - targets: ['redis-exporter:9121']
        scrape_interval: 30s
        
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
        - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
        - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
          action: keep
          regex: default;kubernetes;https
        
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
        - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)

  alert_rules.yml: |
    groups:
    - name: claude_flow_alerts
      rules:
      - alert: HighErrorRate
        expr: rate(claude_flow_requests_total{status=~"5.."}[5m]) / rate(claude_flow_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} for the last 5 minutes"
      
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(claude_flow_request_duration_seconds_bucket[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High latency detected"
          description: "95th percentile latency is {{ $value }}s"
      
      - alert: ServiceDown
        expr: up{job="claude-flow"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Claude-Flow service is down"
          description: "Claude-Flow service has been down for more than 1 minute"
      
      - alert: DatabaseConnectionsHigh
        expr: claude_flow_database_connections / claude_flow_database_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High database connection usage"
          description: "Database connection usage is {{ $value | humanizePercentage }}"