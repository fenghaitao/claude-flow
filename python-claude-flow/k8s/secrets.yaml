# Secret for Claude-Flow sensitive configuration
apiVersion: v1
kind: Secret
metadata:
  name: claude-flow-secrets
  namespace: claude-flow
  labels:
    app.kubernetes.io/name: claude-flow
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database credentials
  POSTGRES_PASSWORD: "secure_postgres_password_123"
  POSTGRES_USER: "claudeflow"
  POSTGRES_DB: "claudeflow"
  DATABASE_URL: "postgresql://claudeflow:secure_postgres_password_123@postgres-service:5432/claudeflow"
  
  # Redis credentials
  REDIS_PASSWORD: "secure_redis_password_123"
  REDIS_URL: "redis://:secure_redis_password_123@redis-service:6379/0"
  
  # API Keys
  ANTHROPIC_API_KEY: "your_anthropic_api_key_here"
  OPENAI_API_KEY: "your_openai_api_key_here"
  
  # Application secrets
  SECRET_KEY: "super_secure_secret_key_for_production_use_only"
  JWT_SECRET: "jwt_secret_key_for_token_signing"
  
  # Monitoring credentials
  GRAFANA_ADMIN_PASSWORD: "secure_grafana_password_123"
  PROMETHEUS_PASSWORD: "secure_prometheus_password_123"
  
  # Message queue credentials
  RABBITMQ_DEFAULT_USER: "claudeflow"
  RABBITMQ_DEFAULT_PASS: "secure_rabbitmq_password_123"
  
  # External service credentials
  SMTP_PASSWORD: "smtp_password_for_notifications"
  WEBHOOK_SECRET: "webhook_secret_for_external_integrations"

---
# TLS Secret for HTTPS
apiVersion: v1
kind: Secret
metadata:
  name: claude-flow-tls
  namespace: claude-flow
  labels:
    app.kubernetes.io/name: claude-flow
    app.kubernetes.io/component: tls
type: kubernetes.io/tls
data:
  # Base64 encoded TLS certificate and key
  # Generate with: kubectl create secret tls claude-flow-tls --cert=path/to/tls.crt --key=path/to/tls.key -n claude-flow --dry-run=client -o yaml
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t...  # Your TLS certificate
  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0t...  # Your TLS private key

---
# Service Account for Claude-Flow
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude-flow-service-account
  namespace: claude-flow
  labels:
    app.kubernetes.io/name: claude-flow
    app.kubernetes.io/component: serviceaccount
automountServiceAccountToken: true

---
# ClusterRole for Claude-Flow (minimal permissions)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claude-flow-cluster-role
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]

---
# ClusterRoleBinding for Claude-Flow
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-flow-cluster-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: claude-flow-cluster-role
subjects:
- kind: ServiceAccount
  name: claude-flow-service-account
  namespace: claude-flow

---
# Role for namespace-specific permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: claude-flow
  name: claude-flow-role
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets", "events"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: [""]
  resources: ["pods/log", "pods/status"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments/status", "replicasets/status"]
  verbs: ["get", "list"]

---
# RoleBinding for namespace permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claude-flow-role-binding
  namespace: claude-flow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: claude-flow-role
subjects:
- kind: ServiceAccount
  name: claude-flow-service-account
  namespace: claude-flow