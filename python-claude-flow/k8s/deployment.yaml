# Claude-Flow Main Application Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-flow-app
  namespace: claude-flow
  labels:
    app.kubernetes.io/name: claude-flow
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: claude-flow
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: claude-flow
      app.kubernetes.io/component: application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claude-flow
        app.kubernetes.io/component: application
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: claude-flow-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: claude-flow
        image: claude-flow:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: DEBUG
          value: "false"
        - name: LOG_LEVEL
          value: "INFO"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: claude-flow-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: claude-flow-secrets
              key: REDIS_URL
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: claude-flow-secrets
              key: ANTHROPIC_API_KEY
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: claude-flow-secrets
              key: SECRET_KEY
        - name: JAEGER_ENDPOINT
          value: "jaeger-collector:14268"
        - name: PROMETHEUS_MULTIPROC_DIR
          value: "/tmp/prometheus_multiproc"
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
          readOnly: true
        - name: logs-volume
          mountPath: /app/logs
        - name: tmp-volume
          mountPath: /tmp
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
      volumes:
      - name: config-volume
        configMap:
          name: claude-flow-config
      - name: logs-volume
        emptyDir: {}
      - name: tmp-volume
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - claude-flow
              topologyKey: kubernetes.io/hostname
      tolerations:
      - key: "claude-flow.io/dedicated"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"

---
# Claude-Flow Service
apiVersion: v1
kind: Service
metadata:
  name: claude-flow-service
  namespace: claude-flow
  labels:
    app.kubernetes.io/name: claude-flow
    app.kubernetes.io/component: application
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: claude-flow
    app.kubernetes.io/component: application

---
# AI Worker Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-worker
  namespace: claude-flow
  labels:
    app.kubernetes.io/name: ai-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: claude-flow
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-worker
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-worker
        app.kubernetes.io/component: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: claude-flow-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: ai-worker
        image: claude-flow-ai-worker:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
          name: http
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: CUDA_VISIBLE_DEVICES
          value: "all"
        - name: TRANSFORMERS_CACHE
          value: "/app/cache/transformers"
        - name: HF_HOME
          value: "/app/cache/huggingface"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: claude-flow-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: claude-flow-secrets
              key: REDIS_URL
        volumeMounts:
        - name: model-cache
          mountPath: /app/cache
        - name: logs-volume
          mountPath: /app/logs
        resources:
          requests:
            memory: "4Gi"
            cpu: "2000m"
            nvidia.com/gpu: 1
          limits:
            memory: "8Gi"
            cpu: "4000m"
            nvidia.com/gpu: 1
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8001
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 20
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: ai-worker-cache-pvc
      - name: logs-volume
        emptyDir: {}
      nodeSelector:
        accelerator: nvidia-tesla-gpu
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"

---
# AI Worker Service
apiVersion: v1
kind: Service
metadata:
  name: ai-worker-service
  namespace: claude-flow
  labels:
    app.kubernetes.io/name: ai-worker
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  ports:
  - port: 8001
    targetPort: 8001
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: ai-worker
    app.kubernetes.io/component: worker

---
# AI Worker Cache PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-worker-cache-pvc
  namespace: claude-flow
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: "fast-ssd"
  resources:
    requests:
      storage: 50Gi

---
# Horizontal Pod Autoscaler for Claude-Flow App
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: claude-flow-app-hpa
  namespace: claude-flow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: claude-flow-app
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60

---
# Pod Disruption Budget for Claude-Flow App
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: claude-flow-app-pdb
  namespace: claude-flow
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: claude-flow
      app.kubernetes.io/component: application

---
# Pod Disruption Budget for AI Worker
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-worker-pdb
  namespace: claude-flow
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-worker
      app.kubernetes.io/component: worker